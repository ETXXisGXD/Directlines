<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <linearGradient id="towerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Big Bold 'D' -->
  <path d="M 80 80 L 145 80 C 190 80 220 108 220 155 C 220 202 190 230 145 230 L 80 230 Z M 122 118 L 122 192 L 140 192 C 165 192 178 178 178 155 C 178 132 165 118 140 118 Z" 
        fill="#142b58" />

  <!-- The Tower 'i' -->
  <!-- Radio Waves -->
  <path d="M 235 190 A 55 55 0 1 1 325 190" fill="none" stroke="url(#towerRed)" stroke-width="15" stroke-linecap="round"/>
  <path d="M 250 182 A 38 38 0 1 1 310 182" fill="none" stroke="url(#towerRed)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 264 174 A 22 22 0 1 1 296 174" fill="none" stroke="url(#towerRed)" stroke-width="9" stroke-linecap="round"/>

  <!-- Antenna Top Bulb -->
  <circle cx="280" cy="148" r="9" fill="#dc2626" />

  <!-- Antenna Legs -->
  <path d="M 276 148 L 248 230 L 268 230 L 278 190 L 282 190 L 292 230 L 312 230 L 284 148 Z" fill="url(#towerRed)"/>
  
  <!-- Base arch cutout -->
  <path d="M 260 230 C 270 210 290 210 300 230 Z" fill="#ffffff"/>

  <!-- Antenna Internal Struts -->
  <line x1="272" y1="172" x2="288" y2="186" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="288" y1="172" x2="272" y2="186" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="268" y1="192" x2="292" y2="215" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="292" y1="192" x2="268" y2="215" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 'rectlines' Typography -->
  <text x="325" y="230" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="160" font-weight="900" fill="#142b58" letter-spacing="-2px">rectlines</text>

  <!-- 'Technologies & Telecoms Ltd' -->
  <text x="450" y="295" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="52" font-weight="800" fill="#b7232b" letter-spacing="1.5px">Technologies &amp; Telecoms Ltd</text>

  <!-- '...Live Smart, Connect More' -->
  <text x="450" y="352" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, sans-serif" font-style="italic" font-size="40" font-weight="700" fill="#142b58" letter-spacing="0.5px">...Live Smart, Connect More</text>
</svg>
