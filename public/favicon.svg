<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background transparent or clean -->
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f2042"/>
    </linearGradient>
  </defs>

  <!-- Big Bold Navy 'D' -->
  <path d="M 60 95 L 175 95 C 235 95 270 135 270 205 C 270 275 235 315 175 315 L 60 315 Z M 120 150 L 120 260 L 165 260 C 198 260 215 240 215 205 C 215 170 198 150 165 150 Z" 
        fill="#142b58" />

  <!-- Radio Waves (Concentric Arcs) -->
  <!-- Outer Arc -->
  <path d="M 315 250 A 90 90 0 1 1 455 250" fill="none" stroke="url(#redGrad)" stroke-width="24" stroke-linecap="round"/>
  <!-- Middle Arc -->
  <path d="M 338 238 A 62 62 0 1 1 432 238" fill="none" stroke="url(#redGrad)" stroke-width="20" stroke-linecap="round"/>
  <!-- Inner Arc -->
  <path d="M 360 226 A 35 35 0 1 1 410 226" fill="none" stroke="url(#redGrad)" stroke-width="16" stroke-linecap="round"/>

  <!-- Antenna Mast Head Bulb -->
  <circle cx="385" cy="185" r="15" fill="#dc2626" />

  <!-- Tower Mast & Structure -->
  <!-- Main Legs -->
  <path d="M 380 185 L 340 325 L 368 325 L 383 260 L 387 260 L 402 325 L 430 325 L 390 185 Z" fill="url(#redGrad)"/>
  
  <!-- Base Arch Cutout -->
  <path d="M 358 325 C 370 295 400 295 412 325 Z" fill="#030712"/>

  <!-- Cross Braces -->
  <!-- Upper Cross -->
  <line x1="375" y1="225" x2="395" y2="245" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <line x1="395" y1="225" x2="375" y2="245" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <!-- Lower Cross -->
  <line x1="368" y1="260" x2="402" y2="295" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <line x1="402" y1="260" x2="368" y2="295" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Horizontal Struts -->
  <line x1="373" y1="225" x2="397" y2="225" stroke="#ffffff" stroke-width="4.5" />
  <line x1="368" y1="260" x2="402" y2="260" stroke="#ffffff" stroke-width="5" />
</svg>
